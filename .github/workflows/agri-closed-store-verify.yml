name: AgriMarket closed-store verification
on:
  push:
    branches: [work/agri-closed-store-20260923]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align applied migration identity
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          old='supabase/migrations/20260923183000_agrimarket_catalog_visibility_v1.sql'
          new='supabase/migrations/20260922183725_agrimarket_catalog_visibility_v1.sql'
          assert Path(old).is_file() and not Path(new).exists()
          subprocess.run(['git','mv',old,new],check=True)
          test=Path('tests/agrimarket-closed-store/run.cjs')
          source=test.read_text()
          assert source.count(old)==1
          test.write_text(source.replace(old,new))
          subprocess.run(['git','add',str(test)],check=True)
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression suites
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-tests.log
      - name: TypeScript check
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-types.log
      - name: Commit only the verified migration identity changes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          expected={'supabase/migrations/20260923183000_agrimarket_catalog_visibility_v1.sql','supabase/migrations/20260922183725_agrimarket_catalog_visibility_v1.sql','tests/agrimarket-closed-store/run.cjs'}
          assert set(actual)==expected,actual
          subprocess.run(['git','config','user.name','JRide verification bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Align catalog approval migration with production history'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/agri-closed-store-20260923'],check=True)
          Path('/tmp/agri-verified-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Collect verification output
        if: always()
        run: |
          mkdir -p /tmp/agri-results
          cp /tmp/agri-tests.log /tmp/agri-types.log /tmp/agri-verified-commit.txt /tmp/agri-results/ 2>/dev/null || true
          git diff --cached --stat > /tmp/agri-results/staged-files.txt
          git archive --format=tar.gz -o /tmp/agri-results/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agri-closed-store-verification
          path: /tmp/agri-results
          retention-days: 3
