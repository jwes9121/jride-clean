name: Passenger updater syntax verification
on:
  push:
    branches: [work/agri-closed-store-20260923]
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode exact updater command body
        shell: python
        run: |
          import base64,zlib,hashlib
          from pathlib import Path
          data=''''''
          body=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(body).hexdigest()=='77921f9e4423d82d2ba9662969fd1c5b4344df9dd87a7e4237d785e94e8313c7'
          Path('/tmp/updater-body.ps1').write_bytes(body)
      - name: Parse updater without executing any commands
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('/tmp/updater-body.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          Write-Host 'PASS PowerShell syntax: exact updater command body; no update or installation executed.'
