name: Passenger quantity test dependencies
on:
  push:
    branches: [work/agri-quantity-v1-validation-20260923]
    paths: [.github/workflows/agri-quantity-test-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect pinned test dependencies and installed Android API
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agri-test-libs"
          cd "$RUNNER_TEMP/agri-test-libs"
          curl --fail --location --retry 2 -o junit.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl --fail --location --retry 2 -o hamcrest.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl --fail --location --retry 2 -o json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          api=$(find "$sdk/platforms" -name android.jar | sort -V | tail -1)
          test -n "$api"
          cp "$api" android.jar
          printf 'Android API source: %s\nJUnit: 4.13.2\nHamcrest: 1.3\nJSON-java: 20240303\n' "$api" > sources.txt
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: passenger-quantity-test-libs
          path: ${{ runner.temp }}/agri-test-libs
          retention-days: 1
