name: AgriMarket schedule updater verification
on:
  push:
    branches: [work/agrimarket-schedule-verification-20260923]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Prepare exact updater logic and isolated fixtures
        shell: python
        run: |
          import base64,gzip,hashlib,json,io,zipfile,os
          from pathlib import Path
          data=""
          body=gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(body).hexdigest()=='aa506875d22444b4f115e64c74684a0a4d3bbf1f21584aca878f6c98426b9fe1'
          root=Path(os.environ['RUNNER_TEMP'])/'agri-schedule-fixture'
          root.mkdir()
          project=root/'project'
          prefix='app/src/main/java/com/jride/app/passenger/agrimarket/'
          names=['PassengerAgrimarketActivity.kt','PassengerAgrimarketOrderActivity.kt','AgrimarketPassengerRules.kt','AgrimarketScheduleText.kt']
          extras=['PassengerAgrimarketModels.kt','PassengerAgrimarketClient.kt','AgrimarketStoreAvailability.kt']
          sha=lambda b:hashlib.sha256(b).hexdigest().upper()
          manifest={'files':[],'required_unchanged':[]}
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,'w',zipfile.ZIP_DEFLATED) as z:
              for i,n in enumerate(names):
                  p=project/prefix/n
                  p.parent.mkdir(parents=True,exist_ok=True)
                  before=('BEFORE '+n).encode() if i<3 else None
                  after=('AFTER '+n).encode()
                  if before is not None:p.write_bytes(before)
                  manifest['files'].append({'path':prefix+n,'before_sha256':sha(before) if before is not None else None,'after_sha256':sha(after)})
                  z.writestr('source/'+prefix+n,after)
              for n in extras:
                  b=('UNCHANGED '+n).encode()
                  (project/prefix/n).write_bytes(b)
                  manifest['required_unchanged'].append({'path':prefix+n,'sha256':sha(b)})
              z.writestr('update-manifest.json',json.dumps(manifest))
              z.writestr('changes.diff','Fixture content only; no real app source.')
          payload=stream.getvalue()
          script=body.decode().replace('__PAYLOAD__',base64.b64encode(payload).decode()).replace('__PAYLOAD_HASH__',sha(payload))
          (root/'updater.ps1').write_bytes(script.encode())
          (root/'manifest.json').write_text(json.dumps(manifest))
          (project/'gradlew.bat').write_text('@echo off\nexit /b 93\n')
          p=project/'app/src/main/java/com/jride/app/driver/Protected.kt'
          p.parent.mkdir(parents=True)
          p.write_text('DO NOT CHANGE DRIVER')
          (project/'app/build.gradle').write_text('versionCode 500000100')
      - name: Windows PowerShell 5.1 guarded updater tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $root = Join-Path $env:RUNNER_TEMP 'agri-schedule-fixture'
          $script = Join-Path $root 'updater.ps1'
          $project = Join-Path $root 'project'
          $manifest = Get-Content -LiteralPath (Join-Path $root 'manifest.json') -Raw | ConvertFrom-Json
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Parser failed' }
          Write-Host 'PASS Windows PowerShell 5.1 parser'
          function Read-Result([string]$Folder) {
            $found = @(Get-ChildItem -LiteralPath $Folder -Filter 'RESULT.json' -Recurse -File)
            if ($found.Count -ne 1) { throw 'Expected one result report' }
            return (Get-Content -LiteralPath $found[0].FullName -Raw | ConvertFrom-Json)
          }
          $readonly = Join-Path $root 'readonly'
          & $script -ProjectRoot $project -OutputDirectory $readonly
          $r = Read-Result $readonly
          if (!$r.source_check_passed -or $r.source_changed -or $r.failure) { throw 'Read-only test failed' }
          Write-Host 'PASS read-only checks without project writes'
          $apply = Join-Path $root 'apply'
          & $script -ProjectRoot $project -OutputDirectory $apply -Apply
          $r = Read-Result $apply
          if (!$r.source_check_passed -or !$r.source_changed -or $r.failure -or $r.protected_violations.Count -ne 0) { throw 'Apply test failed' }
          foreach ($f in $manifest.files) { if ((Get-FileHash -LiteralPath (Join-Path $project $f.path)).Hash -ne $f.after_sha256) { throw 'Output hash mismatch' } }
          if ($r.build_requested -or $r.apk_installed -or $r.version_changes_requested) { throw 'Unexpected action' }
          Write-Host 'PASS scoped apply and Windows path normalization; no build or install'
          $repeat = Join-Path $root 'repeat'
          & $script -ProjectRoot $project -OutputDirectory $repeat -Apply
          $r = Read-Result $repeat
          if ($r.source_changed -or $r.failure) { throw 'Repeat test failed' }
          Write-Host 'PASS already-applied files are not rewritten'
          $driftFile = Join-Path $project $manifest.files[1].path
          [IO.File]::WriteAllText($driftFile,'NEWER UNRELATED LOCAL EDIT')
          $before = (Get-FileHash -LiteralPath $driftFile).Hash
          $drift = Join-Path $root 'drift'
          $caught = $false
          try { & $script -ProjectRoot $project -OutputDirectory $drift -Apply } catch { $caught = $true }
          $r = Read-Result $drift
          if (!$caught -or !$r.failure -or $r.source_changed -or $r.source_check_passed) { throw 'Source drift gate failed' }
          if ((Get-FileHash -LiteralPath $driftFile).Hash -ne $before) { throw 'Newer edit overwritten' }
          Write-Host 'PASS source drift stops without overwriting local edits and exports result'
          $driver = Join-Path $project 'app/src/main/java/com/jride/app/driver/Protected.kt'
          if ((Get-Content -LiteralPath $driver -Raw) -ne 'DO NOT CHANGE DRIVER') { throw 'Driver changed' }
          if ((Get-Content -LiteralPath (Join-Path $project 'app/build.gradle') -Raw) -ne 'versionCode 500000100') { throw 'Version changed' }
          Write-Host 'PASS driver and version settings unchanged'
          $caught = $false
          try { & $script -ProjectRoot $project -OutputDirectory (Join-Path $root 'invalid-build') -Build } catch { $caught = $true }
          if (!$caught) { throw 'Build accepted without Apply' }
          Write-Host 'PASS Build requires explicit Apply'
          Write-Host 'PASS 7 updater checks; synthetic project only; no real APK or source modified.'
