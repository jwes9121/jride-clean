name: Passenger history recovery verification
on:
  push:
    branches: [work/agri-passenger-history-verify-20260923]
    paths: [.github/workflows/agri-passenger-history-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7189058a33a1e04542262b1672de5fec849df78b
          persist-credentials: false
      - name: Snapshot all checked-out source bytes
        shell: python
        run: |
          import subprocess,hashlib,json
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0')
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          Path('/tmp/agri-source-before.json').write_text(json.dumps(before))
          paths=['app/api/agrimarket/orders/history/route.ts','tests/agrimarket-passenger-history/run.cjs','package.json','app/api/agrimarket/producer/orders/harvest/route.ts','tests/agrimarket-scheduled-readiness/run.cjs','supabase/migrations/20260923080500_agrimarket_scheduled_preparation_guard_v1.sql']
          for p in paths:
              assert Path(p).read_bytes()==subprocess.check_output(['git','show','HEAD:'+p]),p
          print('Exact release files verified; all checked-out source bytes snapshotted.')
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: All regression groups
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-history-tests.log
      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-history-types.log
      - name: Confirm tested commit and exact source preservation
        shell: python
        run: |
          import subprocess,hashlib,json
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha=='7189058a33a1e04542262b1672de5fec849df78b'
          before=json.loads(Path('/tmp/agri-source-before.json').read_text())
          for p,h in before.items():
              assert Path(p).is_file() and hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          Path('/tmp/agri-history-tested-commit.txt').write_text(sha+'\nPASS: all '+str(len(before))+' tracked files unchanged byte-for-byte during tests.\n')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-history-verification
          path: |
            /tmp/agri-history-tests.log
            /tmp/agri-history-types.log
            /tmp/agri-history-tested-commit.txt
          retention-days: 3
