name: JFleet add-on payment retry checks
on:
  push:
    branches: [work/jfleet-addon-payment-retry-20260926]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      JRIDE_JFLEET_ENABLED: 'false'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: jfleet-test-not-real
      SUPABASE_SERVICE_ROLE_KEY: jfleet-test-not-real
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run JFleet regressions
        run: |
          node tests/jfleet-routing/run.cjs
          node tests/jfleet-owner-review/run.cjs
          node tests/jfleet-customer/run.cjs
          node tests/jfleet-entrypoints/run.cjs
          node tests/jfleet-payment-retry/run.cjs
          node tests/jfleet-addon-payment-retry/run.cjs
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit --pretty false
