name: AgriMarket accepted terms verification
on:
  push:
    branches: [work/agri-accepted-terms-20260923]
    paths: [.github/workflows/agri-accepted-terms-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify previously tested source and apply exact final web refinement
        shell: python
        run: |
          from pathlib import Path
          import base64,zlib,hashlib,json,subprocess
          data=''.join(Path(f'.ci/agri-accepted-terms/part{n}.b64').read_text().strip() for n in (1,2,3,4))
          if 'WK5MWyMdc' in data:
              assert data.count('WK5MWyMdc')==1
              data=data.replace('WK5MWyMdc','WK5MWy1/GxpTMrmVdc')
          assert hashlib.sha256(data.encode()).hexdigest()=='8118aa80b99e8f6e2eef43b2fc183e86e91c1e4612fe2c657c9e5c683f104076'
          files=json.loads(zlib.decompress(base64.b64decode(data)))['files']
          assert len(files)==13
          for f in files:
              assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],'Previously tested source changed: '+f['path']
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked if p and Path(p).is_file()}
          subprocess.run(['python','.ci/agri-accepted-terms/refine_web.py'],check=True)
          changed={'app/agrimarket/page.tsx':'e04c924bf7b57e67edb41f2e6a021c8434b9803ba05ae3af1f6197a2d6f0aa72','tests/agrimarket-accepted-terms/run.cjs':'17d3951742518b7bdbf81dc35aff36b08ca1c588b130843ef700afe9b79cdd56'}
          for f in files:
              if f['path'] in changed:f['after']=changed[f['path']]
              assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after']
          subprocess.run(['git','add',*changed],check=True)
          Path('/tmp/agri-manifest.json').write_text(json.dumps(files))
          Path('/tmp/agri-source-before.json').write_text(json.dumps(before))
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full regression suites
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-tests.log
      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-types.log
      - name: Verify source preservation and commit exact web refinement
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          files=json.loads(Path('/tmp/agri-manifest.json').read_text())
          changed={'app/agrimarket/page.tsx','tests/agrimarket-accepted-terms/run.cjs'}
          before=json.loads(Path('/tmp/agri-source-before.json').read_text())
          for p,h in before.items():
              if p not in changed:assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,'Unrelated source changed: '+p
          for f in files:assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],'Test modified source: '+f['path']
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==changed
          subprocess.run(['git','config','user.name','JRide verification bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Align web cart line totals with accepted server quote and disclose expiry'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/agri-accepted-terms-20260923'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          verified=[{'path':f['path'],'sha':subprocess.check_output(['git','rev-parse','HEAD:'+f['path']],text=True).strip(),'sha256':f['after']} for f in files]
          Path('/tmp/verified-files.json').write_text(json.dumps({'commit':sha,'files':verified,'unchanged_source_files':len(before)-len(changed)},indent=2))
          print(Path('/tmp/verified-files.json').read_text())
      - name: Collect exact verification output
        if: always()
        run: |
          mkdir -p /tmp/agri-results
          cp /tmp/agri-tests.log /tmp/agri-types.log /tmp/verified-files.json /tmp/agri-results/ 2>/dev/null || true
          git diff --cached --stat > /tmp/agri-results/staged-files.txt
          git archive --format=tar.gz -o /tmp/agri-results/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agrimarket-accepted-terms-verification
          path: /tmp/agri-results
          retention-days: 3
