name: AgriMarket accepted terms verification
on:
  push:
    branches: [work/agri-accepted-terms-20260923]
    paths: [.github/workflows/agri-accepted-terms-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify bundle and exact baseline before applying scoped changes
        shell: python
        run: |
          from pathlib import Path
          import base64,zlib,hashlib,json,subprocess
          root=Path('.').resolve()
          data=''.join((root/f'.ci/agri-accepted-terms/part{n}.b64').read_text().strip() for n in (1,2,3,4))
          # Correct one identified transcription omission in the staged transport.
          # The independent full checksum below remains mandatory before decoding.
          if 'WK5MWyMdc' in data:
              assert data.count('WK5MWyMdc')==1
              data=data.replace('WK5MWyMdc','WK5MWy1/GxpTMrmVdc')
          assert hashlib.sha256(data.encode()).hexdigest()=='8118aa80b99e8f6e2eef43b2fc183e86e91c1e4612fe2c657c9e5c683f104076','Transport checksum mismatch'
          b=json.loads(zlib.decompress(base64.b64decode(data)))
          assert b['base']=='84159ec7e63fa574e70aa2ba0007e311714fa9b1'
          allowed={'app/agrimarket/order/page.tsx','app/agrimarket/page.tsx','app/api/agrimarket/_lib/order.ts','app/api/agrimarket/order-harvest-response/route.ts','app/api/agrimarket/order-status/route.ts','app/api/agrimarket/orders/route.ts','app/api/agrimarket/quote/route.ts','lib/agrimarket/checkoutMoney.ts','lib/agrimarket/checkoutQuote.ts','package.json','supabase/migrations/20260923153554_agrimarket_accepted_terms_v1.sql','tests/agrimarket-accepted-terms/run.cjs','tests/agrimarket-closed-store/run.cjs'}
          assert {f['path'] for f in b['files']}==allowed
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          snapshot={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked if p and (root/p).is_file()}
          for f in b['files']:
              p=root/f['path']
              got=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert got==f['before'],'Source drift: '+f['path']
              if f['before_blob']:
                  assert subprocess.check_output(['git','rev-parse','HEAD:'+f['path']],text=True).strip()==f['before_blob'],'Git blob drift: '+f['path']
          Path('/tmp/agri-accepted-terms.patch').write_text(b['patch'])
          subprocess.run(['git','apply','--check','--index','/tmp/agri-accepted-terms.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/agri-accepted-terms.patch'],check=True)
          for f in b['files']:
              assert hashlib.sha256((root/f['path']).read_bytes()).hexdigest()==f['after'],'After hash: '+f['path']
          Path('/tmp/agri-manifest.json').write_text(json.dumps(b['files']))
          Path('/tmp/agri-source-before.json').write_text(json.dumps(snapshot))
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full regression suites
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-tests.log
      - name: TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-types.log
      - name: Verify exact source preservation and commit scoped files
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          files=json.loads(Path('/tmp/agri-manifest.json').read_text())
          allowed={f['path'] for f in files}
          before=json.loads(Path('/tmp/agri-source-before.json').read_text())
          for p,h in before.items():
              if p not in allowed: assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,'Unrelated source changed: '+p
          for f in files: assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],'Test modified source: '+f['path']
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==allowed,actual
          subprocess.run(['git','config','user.name','JRide verification bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Verify exact quote approval, decimal line totals and proposal identity'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/agri-accepted-terms-20260923'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          verified=[{'path':f['path'],'sha':subprocess.check_output(['git','rev-parse','HEAD:'+f['path']],text=True).strip(),'sha256':f['after']} for f in files]
          Path('/tmp/verified-files.json').write_text(json.dumps({'commit':sha,'files':verified,'unchanged_source_files':len(before)-len([f for f in files if f['before']])},indent=2))
          print(Path('/tmp/verified-files.json').read_text())
      - name: Collect exact verification output
        if: always()
        run: |
          mkdir -p /tmp/agri-results
          cp /tmp/agri-tests.log /tmp/agri-types.log /tmp/verified-files.json /tmp/agri-results/ 2>/dev/null || true
          git diff --cached --stat > /tmp/agri-results/staged-files.txt
          git archive --format=tar.gz -o /tmp/agri-results/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agrimarket-accepted-terms-verification
          path: /tmp/agri-results
          retention-days: 3
