name: AgriMarket V2 installer fixtures
on:
  push:
    branches: [work/agri-schedule-v2-installer-a0204175]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Prepare exact installer and isolated test harness
        shell: python
        run: |
          import base64,gzip,json,hashlib,os
          from pathlib import Path
          data=''' '''
          raw=gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(raw).hexdigest()=='8d4120373bfc04d757edd4b841d307b3c75677466abdff9f6be0265d44ecfa37'
          bundle=json.loads(raw)
          p=Path(os.environ['RUNNER_TEMP'])
          b=bundle['installer'].encode('ascii')
          assert hashlib.sha256(b).hexdigest().upper()=='141B5A80B46A28965D83B3FE68927A184E2028FD4B269409C3E1D01F38D42BE0'
          (p/'reviewed-v2-installer.ps1').write_bytes(b)
          (p/'installer-fixture-tests.ps1').write_bytes(bundle['tests'].encode('ascii'))
      - name: Run Windows PowerShell 5.1 verification without a device
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\installer-fixture-tests.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
