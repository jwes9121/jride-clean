name: Farmer name and reservation verification
on:
  push:
    branches: [work/agri-profile-name-cuts-20260923]
    paths: [.github/workflows/agri-name-cuts-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify and add reservation cancellation notice
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess
          p=Path('lib/agrimarket/orderExpiry.ts')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3ec0313d1b87d8c72dcfc889782a9ca880f7b819481f3149ad05b13f3c7d12fd'
          s=p.read_text().replace('cancel_reason?: string | null }','cancel_reason?: string | null; fulfillment_mode?: string }')
          assert s.count('  return null;')==1
          addition='\n'.join(['  if (order.status === "cancelled" && order.fulfillment_mode === "scheduled_harvest") return {','    title: "Reservation cancelled",','    message: order.cancel_reason?.replace(/_/g, " ").trim() || "This reservation was cancelled. Return to AgriMarket to choose available products.",','  };','  return null;'])
          p.write_text(s.replace('  return null;',addition))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='652969741fece7f346a192da372f5bb99bea0fb08e38e3ea9d936803bd85034d'
          t=Path('tests/agrimarket-reservation-cancel/run.cjs')
          assert hashlib.sha256(t.read_bytes()).hexdigest()=='0c8058a9b6ebf776efd5906b6e48d54778182944215dacb8881f2427629cfc84'
          old=" console.log('Reservation cancellation/parts: '+passed+' groups passed.');"
          add=" await test('passenger web shows cancelled reservation reason instead of preparation/payment instructions',()=>{const f=load('lib/agrimarket/orderExpiry.ts').agrimarketExpiryNotice;const reason='Reserved cut no longer available - sold outside JRide. Affected cuts: Pig - Belly';const x=f({status:'cancelled',fulfillment_mode:'scheduled_harvest',cancel_reason:reason});assert.equal(x.title,'Reservation cancelled');assert.equal(x.message,reason);assert.equal(f({status:'awaiting_harvest',fulfillment_mode:'scheduled_harvest'}),null);assert.match(f({status:'cancelled',cancel_reason:'customer_reapproval_timeout',fulfillment_mode:'scheduled_harvest'}).title,/Approval time expired/);const page=read('app/agrimarket/order/page.tsx');assert(page.indexOf('{expiryNotice ? <>')<page.indexOf('Cash due now'));assert(page.includes('expiryNotice.message'));});\n"
          s=t.read_text();assert s.count(old)==1
          t.write_text(s.replace(old,add+old))
          assert hashlib.sha256(t.read_bytes()).hexdigest()=='3074b5196506bb204dffa7b4640b007f5a6468b2762962821547f3cbddcc9b07'
          subprocess.run(['git','add',str(p),str(t)],check=True)
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression groups
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-tests.log
      - name: TypeScript verification
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-types.log
      - name: Commit only two reviewed files
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual)=={'lib/agrimarket/orderExpiry.ts','tests/agrimarket-reservation-cancel/run.cjs'}
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','JRide verification bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Show supplier cancellation reason without active reservation instructions'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/agri-profile-name-cuts-20260923'],check=True)
          Path('/tmp/agri-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Export results
        if: always()
        run: |
          mkdir -p /tmp/agri-results
          cp /tmp/agri-tests.log /tmp/agri-types.log /tmp/agri-commit.txt /tmp/agri-results/ 2>/dev/null || true
          git diff --cached --stat > /tmp/agri-results/staged.txt
          git archive --format=tar.gz -o /tmp/agri-results/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agri-profile-name-cuts-verification
          path: /tmp/agri-results
          retention-days: 3
