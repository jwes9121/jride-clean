name: Farmer name and reservation verification
on:
  push:
    branches: [work/agri-profile-name-cuts-20260923]
    paths: [.github/workflows/agri-name-cuts-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate transport and exact source before applying reviewed diff
        shell: python
        run: |
          from pathlib import Path
          import hashlib,base64,zlib,json,subprocess
          text=''.join(Path(f'.ci/agri-name-cuts/part{i}.b64').read_text().strip() for i in (1,2,3))
          for old,new in [('nm/Zz7cC','nm/ZHcC'),('qGfrfbdVbFr','qGfrfVbFr')]:
              assert text.count(old)==1, 'Transport marker missing: '+old
              text=text.replace(old,new)
          assert hashlib.sha256(text.encode()).hexdigest()=='037bebf80f5a93313a150b259a26b66430298c5db629aaec94bffd92302eab97', 'Transport checksum mismatch'
          data=json.loads(zlib.decompress(base64.b64decode(text)))
          paths={f['path'] for f in data['files']}
          assert len(paths)==16
          assert all(p.startswith(('app/agrimarket/producer/','app/api/agrimarket/producer/','lib/agrimarket/','supabase/migrations/','tests/agrimarket-')) or p=='package.json' for p in paths)
          for f in data['files']:
              p=Path(f['path'])
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual==f['before'], 'Source changed: '+str(p)
          Path('/tmp/reviewed.patch').write_text(data['patch'])
          subprocess.run(['git','apply','--check','--unidiff-zero','--index','/tmp/reviewed.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','/tmp/reviewed.patch'],check=True)
          for f in data['files']:
              assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],f['path']
          Path('/tmp/agri-scope.json').write_text(json.dumps(sorted(paths)))
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression groups
        run: |
          set -o pipefail
          npm run prebuild 2>&1 | tee /tmp/agri-tests.log
      - name: TypeScript verification
        run: |
          set -o pipefail
          npx tsc --noEmit --incremental false 2>&1 | tee /tmp/agri-types.log
      - name: Commit only the reviewed files to the isolated branch
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('/tmp/agri-scope.json').read_text())
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(actual)==paths,actual
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','JRide verification bot'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Confirm farm name once and support audited reserved-cut cancellation'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/agri-profile-name-cuts-20260923'],check=True)
          Path('/tmp/agri-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Export results
        if: always()
        run: |
          mkdir -p /tmp/agri-results
          cp /tmp/agri-tests.log /tmp/agri-types.log /tmp/agri-commit.txt /tmp/agri-results/ 2>/dev/null || true
          git diff --cached --stat > /tmp/agri-results/staged.txt
          git archive --format=tar.gz -o /tmp/agri-results/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agri-profile-name-cuts-verification
          path: /tmp/agri-results
          retention-days: 3
